# 请在部署机器填写必填值；填入真实令牌后不要将此文件提交到仓库。
services:
  app:
    image: ghcr.io/ggbondhere/rcmltb:latest
    container_name: rcmltb
    # 直接填写 environment 即可部署，无需另建 config.env。
    # 其他配置见 sample_config.env；也可复制为 config.env 后取消以下两行注释。
    # 同名配置以 environment 为准，避免在两处重复填写。
    # env_file:
    #   - ./config.env
    environment:
      # 必填：机器人令牌，从 Telegram 的 @BotFather 获取。
      BOT_TOKEN: ""
      # 必填：你的 Telegram 数字用户 ID，所有者默认拥有使用权限。
      OWNER_ID: ""
      # 必填：从 my.telegram.org 获取的 API ID 和 API Hash。
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""

      # 常用：改为 "True"，自动保存收到的媒体和纯 TG 消息链接。
      AUTO_MIRROR: "False"
      # 常用：额外允许的用户或聊天数字 ID，以空格分隔；只自用可留空。
      ALLOWED_CHATS: ""
      # 可选：额外管理员的数字用户 ID，以空格分隔；只自用可留空。
      SUDO_USERS: ""

      # 常用：你的 rclone remote 名称，不带冒号；也可留空后在机器人中选择。
      DEFAULT_OWNER_REMOTE: ""
      # 默认共享所有者通过 /files 上传的配置及 /ms 目标；独立配置模式可按 env 模板启用。
      # 网盘复制时允许服务端传输，需对应网盘支持。
      SERVER_SIDE: "True"
      # 可选：机器人读不到原消息时使用的个人账号会话；转发媒体无需填写。
      USER_SESSION_STRING: ""

      # 常用：任务队列的并发数，0 表示不启用此队列。
      PARALLEL_TASKS: "0"
      # 常用：下载、上传的总并发限制，0 表示不限制。
      QUEUE_ALL: "0"
      # 常用：不记录任务日志；排障时可改为 "False"。
      NO_TASKS_LOGS: "True"

      # 以下端口需与 ports 同步修改；可选网页功能的访问地址见 env 模板。
      QB_SERVER_PORT: "18080"
      RC_INDEX_PORT: "18081"
    volumes:
      # 下载目录，宿主机目录需允许容器写入。
      - ./downloads:/usr/src/app/downloads
      # 持久化个人和全局 rclone 配置。
      - ./rclone:/usr/src/app/rclone
      # 持久化 SQLite 设置、凭据备份及网页选种密钥，无需额外部署 MongoDB。
      - ./data:/usr/src/app/data
    # 可选网页端口仅绑定本机，按需通过反向代理访问。
    ports:
      - "127.0.0.1:18080:18080" # qBittorrent 网页选种
      - "127.0.0.1:18081:18081" # rclone 文件索引
    restart: unless-stopped
